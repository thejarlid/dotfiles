- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ['~', '~/.config']

- create:
  - ~/.ssh

- link:
    ~/.bash_profile:
    ~/.bashrc:
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.config/nvim:
    ~/.ssh/config: ssh/config
    ~/.tmux.conf:
    ~/.vim:
    ~/.vimrc:
    ~/.zprofile:
    ~/.zsh:
    ~/.zshrc:

- shell:
  - git submodule sync --recursive
  # the following have to run after linking ~/.gitconfig
  - git submodule update --init --recursive
